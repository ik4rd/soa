syntax = "proto3";
package flight.v1;
option go_package = "flightbooking/api/flight/v1;flightv1";

import "google/protobuf/timestamp.proto";

service FlightService {
  rpc SearchFlights(SearchFlightsRequest) returns (SearchFlightsResponse);
  rpc GetFlight(GetFlightRequest) returns (Flight);
  rpc ReserveSeats(ReserveSeatsRequest) returns (SeatReservation);
  rpc ReleaseReservation(ReleaseReservationRequest) returns (SeatReservation);
}

enum FlightStatus {
  FLIGHT_STATUS_UNSPECIFIED = 0;
  FLIGHT_STATUS_SCHEDULED = 1;
  FLIGHT_STATUS_DEPARTED = 2;
  FLIGHT_STATUS_CANCELLED = 3;
  FLIGHT_STATUS_COMPLETED = 4;
}
enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_ACTIVE = 1;
  RESERVATION_STATUS_RELEASED = 2;
  RESERVATION_STATUS_EXPIRED = 3;
}
message Flight {
  string id = 1;
  string flight_number = 2;
  string airline_code = 3;
  string origin = 4;
  string destination = 5;
  google.protobuf.Timestamp departure_at = 6;
  google.protobuf.Timestamp arrival_at = 7;
  int32 total_seats = 8;
  int32 available_seats = 9;
  int64 price_minor = 10;
  FlightStatus status = 11;
}
message SeatReservation {
  string booking_id = 1;
  string flight_id = 2;
  int32 seat_count = 3;
  ReservationStatus status = 4;
}
message SearchFlightsRequest {
  string origin = 1;
  string destination = 2;
  google.protobuf.Timestamp date = 3;
}
message SearchFlightsResponse { repeated Flight flights = 1; }
message GetFlightRequest { string flight_id = 1; }
message ReserveSeatsRequest {
  string flight_id = 1;
  int32 seat_count = 2;
  string booking_id = 3;
}
message ReleaseReservationRequest { string booking_id = 1; }
