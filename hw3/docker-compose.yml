x-app-env: &app-env
  GRPC_API_KEY: ${GRPC_API_KEY:-local-development-key}

x-sentinel: &sentinel
  image: redis:7.4-alpine
  entrypoint: ["/bin/sh", "-c"]
  command: ["cp /config/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"]
  volumes:
    - ./deploy/redis/sentinel.conf:/config/sentinel.conf:ro
  depends_on:
    redis-master:
      condition: service_healthy
    redis-replica:
      condition: service_started

services:
  tests:
    profiles: [test]
    build:
      context: .
      target: build
      args: { SERVICE: booking }
    command: ["go", "test", "-count=1", "-v", "./..."]
    environment:
      <<: *app-env
      RUN_INTEGRATION: "1"
      FLIGHT_DATABASE_URL: postgres://flight:flight@flight-db:5432/flight?sslmode=disable
      BOOKING_DATABASE_URL: postgres://booking:booking@booking-db:5432/booking?sslmode=disable
      FLIGHT_GRPC_ADDR: flight:50051
      BOOKING_URL: http://booking:8080
      REDIS_SENTINEL_ADDRS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
    depends_on:
      - booking
      - flight

  booking:
    build:
      context: .
      args: { SERVICE: booking }
    ports: ["8080:8080"]
    environment:
      <<: *app-env
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://booking:booking@booking-db:5432/booking?sslmode=disable
      FLIGHT_GRPC_ADDR: flight:50051
      RPC_TIMEOUT: ${RPC_TIMEOUT:-2s}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_INITIAL_BACKOFF: ${RETRY_INITIAL_BACKOFF:-100ms}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
      CB_OPEN_TIMEOUT: ${CB_OPEN_TIMEOUT:-15s}
      CB_WINDOW: ${CB_WINDOW:-30s}
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
      flight:
        condition: service_started

  flight:
    build:
      context: .
      args: { SERVICE: flight }
    ports: ["50051:50051"]
    environment:
      <<: *app-env
      GRPC_ADDR: :50051
      DATABASE_URL: postgres://flight:flight@flight-db:5432/flight?sslmode=disable
      REDIS_MASTER_NAME: flights
      REDIS_SENTINEL_ADDRS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      CACHE_TTL: ${CACHE_TTL:-5m}
    depends_on:
      flight-migrate:
        condition: service_completed_successfully
      sentinel-1:
        condition: service_started
      sentinel-2:
        condition: service_started
      sentinel-3:
        condition: service_started

  booking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes: ["booking-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 2s
      retries: 20

  flight-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
      POSTGRES_DB: flight
    volumes: ["flight-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flight"]
      interval: 2s
      timeout: 2s
      retries: 20

  booking-migrate:
    image: migrate/migrate:v4.18.2
    volumes: ["./migrations/booking:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgres://booking:booking@booking-db:5432/booking?sslmode=disable", "up"]
    depends_on:
      booking-db:
        condition: service_healthy

  flight-migrate:
    image: migrate/migrate:v4.18.2
    volumes: ["./migrations/flight:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgres://flight:flight@flight-db:5432/flight?sslmode=disable", "up"]
    depends_on:
      flight-db:
        condition: service_healthy

  redis-master:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-master-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis-replica:
    image: redis:7.4-alpine
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--appendonly", "yes"]
    volumes: ["redis-replica-data:/data"]
    depends_on:
      redis-master:
        condition: service_healthy

  sentinel-1:
    <<: *sentinel
  sentinel-2:
    <<: *sentinel
  sentinel-3:
    <<: *sentinel

volumes:
  booking-data:
  flight-data:
  redis-master-data:
  redis-replica-data:
